<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>截图编辑器 · Web 开发者工具</title>
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <header class="toolbar">
      <div>
        <p class="eyebrow">WEB DEVELOPER TOOLS</p>
        <h1>截图编辑器</h1>
      </div>
      <div class="toolbar-actions">
        <button id="reset" type="button">重置</button>
        <button id="apply-crop" class="primary" type="button" disabled>裁剪选区</button>
        <button id="download" class="primary" type="button" disabled>下载 PNG</button>
        <button id="close" type="button">关闭</button>
      </div>
    </header>

    <main class="workspace">
      <p id="status" class="status" role="status">正在加载截图…</p>
      <section class="canvas-panel" aria-label="截图编辑区域">
        <p class="hint">在截图上拖拽选择区域；此处编辑的是已经截取的静态图片，不会影响原网页。</p>
        <div class="canvas-wrap">
          <canvas id="screenshot-canvas" aria-label="截图画布"></canvas>
        </div>
      </section>
    </main>
    <script type="module" src="editor.js"></script>
  </body>
</html>
