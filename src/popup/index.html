<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web 开发者工具</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <div>
          <p class="eyebrow">WEB DEVELOPER TOOLS</p>
          <h1>Web 开发者工具</h1>
        </div>
        <span id="status" class="status" role="status">就绪</span>
      </header>

      <p class="intro">点击操作后回到当前网页，按提示选择目标元素。</p>

      <section class="actions" aria-label="元素操作">
        <button id="pick" class="action" type="button">
          <span class="action-icon" aria-hidden="true">↖</span>
          <span class="action-copy">
            <strong>选择元素</strong>
            <small>选择一个元素并复制 Outer HTML</small>
          </span>
          <span class="action-arrow" aria-hidden="true">›</span>
        </button>

        <button id="pick-rich" class="action" type="button">
          <span class="action-icon" aria-hidden="true">＋</span>
          <span class="action-copy">
            <strong>选择元素+</strong>
            <small>选择一个元素并复制完整上下文</small>
          </span>
          <span class="action-arrow" aria-hidden="true">›</span>
        </button>

        <button id="copy-log" class="action" type="button">
          <span class="action-icon" aria-hidden="true">▤</span>
          <span class="action-copy">
            <strong>复制控制台日志</strong>
            <small>复制当前网页的 Console 输出</small>
          </span>
          <span class="action-arrow" aria-hidden="true">›</span>
        </button>

        <button id="capture-screenshot" class="action" type="button">
          <span class="action-icon" aria-hidden="true">▣</span>
          <span class="action-copy">
            <strong>截图并编辑</strong>
            <small>快捷键 Ctrl+Shift+E，先截取再调整区域</small>
          </span>
          <span class="action-arrow" aria-hidden="true">›</span>
        </button>
      </section>

      <div class="log-summary">
        <span>控制台消息</span>
        <output id="log-count">0 条</output>
      </div>
      <p id="message" class="message" role="status">选择完成后，元素 HTML 会自动复制；截图后可在编辑器中调整区域。</p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
